<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LumaCite — игры</title>
<meta name="description" content="LumaCite — небольшие игры для Android и браузера.">
<style>
  :root { --bg:#f6f4ef; --fg:#1d1b18; --muted:#6b665e; --card:#fffdf8; --line:#e4dfd4; --accent:#c2551b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16151a; --fg:#ece8df; --muted:#9a948a; --card:#1f1e24; --line:#2e2c34; --accent:#f08a4b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:56px 16px 40px; }
  h1 { font-size:36px; letter-spacing:-.02em; margin:0 0 6px; }
  .lead { color:var(--muted); margin:0 0 36px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px; font-weight:600; }
  ul { list-style:none; padding:0; margin:0 0 40px; }
  li a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px; margin-bottom:10px;
         background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; }
  li a:hover { border-color:var(--accent); }
  li span { color:var(--accent); font-size:14px; white-space:nowrap; }
  footer { color:var(--muted); font-size:14px; border-top:1px solid var(--line); padding-top:16px; }
</style>
</head>
<body>
<main>
  <h1>LumaCite</h1>
  <p class="lead">Небольшие игры для Android и браузера.</p>

  <h2>Игры в RuStore</h2>
  <ul>
    <li><a href="https://www.rustore.ru/catalog/app/ru.alchemistlab">Лаборатория алхимика <span>RuStore →</span></a></li>
    <li><a href="https://www.rustore.ru/catalog/app/ru.kirpichiizdetstva">Кирпичи из детства <span>RuStore →</span></a></li>
  </ul>

  <footer>Разработчик в RuStore — М Стася</footer>
</main>
</body>
</html>
